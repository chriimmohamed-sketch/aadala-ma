<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://aadala-ma.cheraimmohamed20.workers.dev;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التحليل الجنائي — AADALA.MA</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/legacy-bridge.css">
  <!-- Tailwind via CDN removed: utilities are in assets/css/main.css (static-safe) -->
</head>
<body data-legal-reference-page="criminal">
  <div id="header"></div>
  <section class="section">
    <div class="container">
      <div class="section-title">
        <h2>🔒 التحليل الجنائي (تعليمي)</h2>
        <p>التكييف، الأركان، العقوبات، الدفوع</p>
      </div>
      <div class="alert alert-danger mb-3">
        ⚠️ هذا القسم توضيحي/تعليمي. لا يصدر حكماً بالإدانة أو البراءة. لا تقدم استنتاجاً قطعياً دون ملف مكتمل. استشر محامياً.
      </div>
      <div class="card">
        <h3>إدخال واقعة للتحليل (تعليمي)</h3>
        <div class="form-group">
          <label class="form-label">وصف الواقعة</label>
          <textarea class="form-textarea" id="crimeText" placeholder="صف الواقعة..."></textarea>
        </div>
        <button class="btn btn-primary" onclick="analyzeCrime()">تحليل (تعليمي)</button>
        <div id="crimeResult" class="mt-3"></div>
      </div>
    </div>
  </section>
  <div id="footer"></div>
  <script src="assets/js/app.js"></script>
  
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/legal-content.js"></script>
  <script>
    document.getElementById('header').innerHTML = renderHeader('criminal.html');
    document.getElementById('footer').innerHTML = renderFooter();
    updateAuthUI();
    function analyzeCrime() {
      const t = document.getElementById('crimeText').value.trim();
      if (!t) { AADALA.toast('يرجى إدخال واقعة','error'); return; }
      document.getElementById('crimeResult').innerHTML = `
        <div class="card mt-2">
          <h4>تحليل توضيحي</h4>
          <ul style="list-style:none; line-height:2;">
            <li>• <strong>ملخص الوقائع:</strong> ${AADALA.escape(t)}</li>
            <li>• <strong>التكييف المحتمل:</strong> يتطلب فحص النص (القانون الجنائي — Dahir 1962)</li>
            <li>• <strong>الأركان:</strong> المادية، المعنوية (القصد)</li>
            <li>• <strong>المساهمة/المشاركة:</strong> حسب الأدوار</li>
            <li>• <strong>الشروع:</strong> حسب الإتيان ببداية تنفيذ</li>
            <li>• <strong>الظروف:</strong> مشددة/مخففة حسب النص</li>
            <li>• <strong>العقوبة:</strong> حسب التكييف (غرامة/حبس/سجن)</li>
            <li>• <strong>الدفوع:</strong> إجرائية/موضوعية</li>
          </ul>
          <div class="alert alert-warning mt-2">⚠️ تحليل توضيحي. استشر محامياً. لا حكم إدانة/براءة.</div>
        </div>`;
    }
  </script>
  <script src="assets/js/legal-references.js" defer></script>
</body>
</html>
