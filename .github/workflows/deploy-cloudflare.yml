name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check deploy secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # opennextjs-cloudflare runs `next build` itself, so no separate `npm run build`.
      - run: npm run cf:build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Deploy worker
        run: npx wrangler deploy 2>&1 | tee deploy.log
      # Guard against deploying to the wrong Cloudflare account: wrangler can report
      # success while the canonical site still serves the previous build.
      - name: Verify the canonical site
        run: |
          set -euo pipefail
          SITE="${{ vars.PUBLIC_SITE_URL }}"
          SITE="${SITE:-https://aadala-ma.cheraimmohamed20.workers.dev}"
          echo "Checking $SITE/ar"
          for attempt in $(seq 1 12); do
            html=$(curl -fsS "$SITE/ar?ci=$RANDOM" || true)
            if printf '%s' "$html" | grep -q 'justice-header'; then
              echo "::notice::Canonical site $SITE serves the new build"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Deployed, but $SITE still serves an old build. Check CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN."
          grep -E 'workers\.dev|Current Version ID' deploy.log || true
          exit 1
